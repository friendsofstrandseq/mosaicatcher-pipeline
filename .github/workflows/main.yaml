name: MosaiCatcher basic checks

on:
  push:
    branches:
      - "**"
  schedule:
    - cron: "0 0 * * 0"
jobs:
  Formatting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: latest
          cache: true
          locked: false
          environments: format

      - name: Check Snakemake formatting with snakefmt
        run: |
          pixi run -e format format

  Linting:
    runs-on: ubuntu-latest
    needs: Formatting
    steps:
      - name: Checkout repository without submodules
        uses: actions/checkout@v7

      - name: List contents of .tests-mock
        run: |
          tree -h github-actions-runner/.tests-mock

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: latest
          cache: true
          locked: false

      - name: Run Snakemake Lint (v9)
        run: |
          pixi run -e lint snakemake \
            --config data_location=github-actions-runner/.tests-mock/data_CHR17 \
            --lint

  Testing-basic:
    runs-on: ubuntu-latest
    needs:
      - Formatting
      - Linting
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Git Submodule Update
        run: |
          git submodule update --remote --recursive --force --init

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: latest
          cache: true
          locked: false

      - name: Cache Conda environments
        uses: actions/cache@v6
        with:
          path: .snakemake/conda
          key: conda-envs-${{ hashFiles('workflow/envs/*.yaml') }}
          restore-keys: |
            conda-envs-

      - name: List contents of .tests
        run: |
          tree -h .tests

      - name: Show config file
        run: |
          cat .tests/config/simple_config_mosaicatcher.yaml

      - name: List contents of workflow/data
        run: |
          tree -h workflow/data

      - name: List options of workflow
        run: |
          pixi run snakemake \
            --cores 1 \
            --config list_commands=True

      # EVAs (default cell selection tool) cannot be installed in CI (private
      # repository, not on bioconda): the EVAs modes are covered by dry-runs, and
      # every executed CI run pins .github/ci/cell_selection_ci.yaml (no QC tool).
      - name: Dry-run cell selection modes (EVAs default, no install needed)
        run: |
          set -e
          plans() { grep -qE "^$1 +[0-9]+" "$2"; }
          # Default config (EVAs), BAM and FASTQ input: EVAs must be planned
          pixi run snakemake --cores 1 --sdm conda -n \
            --configfile .tests/config/simple_config_mosaicatcher.yaml > default_bam.log 2>&1
          plans evas_predict default_bam.log
          plans cell_selection_decision default_bam.log
          pixi run snakemake --cores 1 --sdm conda -n \
            --configfile .tests/config/simple_config_ashleys.yaml \
            --config ashleys_pipeline=True use_light_data=False > default_fastq.log 2>&1
          plans evas_predict default_fastq.log
          plans tune_predictions_based_on_threshold default_fastq.log
          # Other modes
          for cs in "{tools: [evas], decision: none}" "{tools: [ashleys], decision: ashleys}"; do
            pixi run snakemake --cores 1 --sdm conda -n \
              --configfile .tests/config/simple_config_mosaicatcher.yaml \
              --config "cell_selection=$cs"
          done
          for cs in "{tools: [ashleys, evas], decision: union}" "{tools: [ashleys, evas], decision: intersection}" "{tools: [ashleys], decision: ashleys}" "{tools: [], decision: none}"; do
            pixi run snakemake --cores 1 --sdm conda -n \
              --configfile .tests/config/simple_config_ashleys.yaml \
              --config ashleys_pipeline=True use_light_data=False "cell_selection=$cs"
          done
          # Invalid combination must stop with a clear message
          if pixi run snakemake --cores 1 -n \
              --configfile .tests/config/simple_config_mosaicatcher.yaml \
              --config "cell_selection={tools: [evas], decision: union}" > invalid.log 2>&1; then
            echo "invalid cell_selection was accepted"; exit 1
          fi
          grep "Invalid cell_selection configuration" invalid.log
          if pixi run snakemake --cores 1 -n \
              --configfile .tests/config/simple_config_mosaicatcher.yaml \
              --config "cell_selection={evas_borderline: maybe}" > invalid_bl.log 2>&1; then
            echo "invalid evas_borderline was accepted"; exit 1
          fi
          grep "evas_borderline: 'maybe' is not one of" invalid_bl.log
          # Borderline modes are accepted (old option: deprecation warning)
          for cs in "{evas_borderline: recommend}" "{evas_borderline: include}" "{evas_borderline_as_pass: True}"; do
            pixi run snakemake --cores 1 -n \
              --configfile .tests/config/simple_config_mosaicatcher.yaml \
              --config "cell_selection=$cs" > bl.log 2>&1 || { cat bl.log; exit 1; }
          done
          grep "evas_borderline_as_pass is deprecated" bl.log
          # The CI configuration never runs EVAs
          for cf in simple_config_mosaicatcher.yaml simple_config_ashleys.yaml; do
            pixi run snakemake --cores 1 --sdm conda -n \
              --configfile .tests/config/$cf .github/ci/cell_selection_ci.yaml > ci_$cf.log 2>&1
            if plans evas_predict ci_$cf.log; then echo "CI run $cf would run EVAs"; exit 1; fi
          done

      - name: Run workflow (MosaiCatcher v9)
        run: |
          pixi run snakemake \
            --cores 1 \
            --sdm conda \
            --configfile .tests/config/simple_config_mosaicatcher.yaml .github/ci/cell_selection_ci.yaml \
            --conda-cleanup-pkgs cache \
            -p \
            --snakefile workflow/Snakefile

  Testing-ashleys-basic:
    runs-on: ubuntu-latest
    needs:
      - Formatting
      - Linting
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Git Submodule Update
        run: |
          git submodule update --remote --recursive --force --init

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: latest
          cache: true
          locked: false

      - name: Cache Conda environments
        uses: actions/cache@v6
        with:
          path: .snakemake/conda
          key: conda-envs-${{ hashFiles('workflow/envs/*.yaml') }}
          restore-keys: |
            conda-envs-

      - name: List contents of .tests
        run: |
          tree -h .tests

      - name: Show ashleys config file
        run: |
          cat .tests/config/simple_config_ashleys.yaml

      - name: List ashleys rules
        run: |
          ls -la workflow/rules/ashleys/

      - name: Run workflow (Ashleys basic v9)
        run: |
          pixi run snakemake \
            --cores 1 \
            --sdm conda \
            --configfile .tests/config/simple_config_ashleys.yaml .github/ci/cell_selection_ci.yaml \
            --conda-cleanup-pkgs cache \
            -p \
            --snakefile workflow/Snakefile
