<script>
// docs/mermaid-revealjs-fix.js
//
// Quarto's built-in mermaid initializer (libs/quarto-diagram/mermaid-init.js)
// processes all <pre class="mermaid-js"> blocks at window.load. In a reveal.js
// deck, every slide except the current one is `display:none` at that moment,
// so mermaid renders into hidden containers and frequently produces a 0×0 SVG
// or silently fails. This shim re-renders any still-unconverted mermaid blocks
// each time a slide becomes visible — solving the hidden-slide measurement
// problem documented in https://github.com/mermaid-js/mermaid/issues/1846.

(function () {
  function render(el, idx) {
    if (el.dataset.fixed === "1") return;
    el.dataset.fixed = "1";
    var text = el.textContent.replace(/&nbsp;/g, " ");
    try {
      var id = "mmd-fix-" + Date.now() + "-" + idx;
      mermaid.mermaidAPI
        .render(id, text)
        .then(function (out) {
          var svg = out && out.svg ? out.svg : out;
          var wrap = document.createElement("div");
          wrap.className = "mermaid-rendered";
          wrap.innerHTML = svg;
          // Scale SVG to fit its slide container
          var s = wrap.querySelector("svg");
          if (s) {
            s.removeAttribute("width");
            s.removeAttribute("height");
            s.style.maxWidth = "100%";
            s.style.height = "auto";
          }
          el.parentNode.replaceChild(wrap, el);
        })
        .catch(function (err) {
          console.error("[mermaid-revealjs-fix] render failed", err);
          el.dataset.fixed = "0"; // allow another retry later
        });
    } catch (err) {
      console.error("[mermaid-revealjs-fix] api error", err);
      el.dataset.fixed = "0";
    }
  }

  function pass() {
    if (typeof mermaid === "undefined") return;
    var blocks = document.querySelectorAll("pre.mermaid-js");
    blocks.forEach(render);
  }

  function wireUp() {
    if (typeof Reveal === "undefined") return setTimeout(wireUp, 120);
    pass(); // process whatever Quarto's init missed on the current slide
    Reveal.on("ready", pass);
    Reveal.on("slidechanged", pass);
    Reveal.on("slidetransitionend", pass);
  }

  if (document.readyState === "complete") {
    setTimeout(wireUp, 250);
  } else {
    window.addEventListener("load", function () {
      // Run after Quarto's own window.load handler had its chance.
      setTimeout(wireUp, 250);
    });
  }
})();
</script>
